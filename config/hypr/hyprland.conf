monitor=eDP-1,1920x1080@144,0x0,1
monitor=HDMI-A-1,1920x1080@144,1920x0,1

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
# $menu = ~/.config/rofi/launchers/type-1/launcher.sh 
$menu = rofi -show
# $menu = walker
# $menu = vicinae toggle

plugin {
    hyprsplit {
        # The number of workspaces to create per monitor
        num_workspaces = 10
    }
}

#################
### AUTOSTART ###
#################

# exec-once = vicinae server
# exec-once = walker --gapplication-service
exec-once = hyprpm reload -n
# exec-once = blueman-applet
# exec-once = nm-applet
exec-once = hypridle
# exec-once = swaync
# exec-once = waypaper --restore
# exec-once = waybar 
