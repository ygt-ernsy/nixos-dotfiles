#############################
### ENVIRONMENT VARIABLES ###
#############################

#
# QT/GTK Theming
#
env = QT_QPA_PLATFORM,wayland
# env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt6ct
# For GTK4 apps
# env = GTK_THEME,Tokyonight-Dark
# env = GTK_THEME,WhiteSur-Dark-Solid


env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 12 #24

env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

# For dolphin "open with" problem
env = XDG_MENU_PREFIX,arch-

env = ELECTRON_OZONE_PLATFORM_HINT,wayland

#####################
### LOOK AND FEEL ###
#####################


general {
    gaps_in = 6
    gaps_out = 6

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

cursor {
    no_hardware_cursors = true
}

decoration {
    rounding_power = 2.4
    rounding = 5

    blur {
        enabled = true
        xray = false
        special = false
        new_optimizations = true
        size = 10
        passes = 3
        brightness = 1
        noise = 0.05
        contrast = 0.89
        vibrancy = 0.5
        vibrancy_darkness = 0.5
        popups = false
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }

    # Frost style
    # blur {
    #     enabled = false
    #     xray = false
    #    special = true 
    #     ignore_opacity = true
    #     new_optimizations = true
    #
    #     size = 6
    #     passes = 3
    #
    #     noise = 0.0117vibrancy = 0.1696
    #     vibrancy_darkness = 0.0
    #     contrast = 0.8916
    #     brightness = 0.8172
    #
    #     vibrancy = 0.1696
    #     vibrancy_darkness = 0.0
    # }

    # Clean sharp style
    # blur {
    #         enabled = true
    #         size = 8
    #         passes = 2      # Fewer passes keeps it less "milky"
    #
    #         new_optimizations = true
    #         xray = true     # This lets the wallpaper shine through more vividly
    #
    #         noise = 0.02
    #         contrast = 1.3  # High contrast makes the background pop
    #         brightness = 1.0
    #     }

    # Hevy blur
    # blur {
    #         enabled = true
    #         size = 12
    #         passes = 3      # or 4 if your GPU is idling (Your 4050 can handle 4)
    #
    #         new_optimizations = true
    #
    #         ignore_opacity = true
    #
    #         noise = 0.05    # Adds film grain texture
    #         contrast = 1.0
    #         brightness = 1.0
    #     }

    # shadow {
    #     enabled = true
    #     ignore_window = true
    #     range = 50
    #     offset = 0 4
    #     render_power = 10
    #     color = rgba(00000027)
    # }
    #
    # # Dim
    # dim_inactive = true
    # dim_strength = 0.05
    # dim_special = 0.07
}

animations {
    enabled = true  # Turn them back on to test!

    # A "Linear" or "EaseOut" curve feels faster because it doesn't overshoot
    bezier = fastBezier, 0.05, 0.9, 0.1, 1.0 

    # Duration lowered to 3 (0.3s) for a snappier feel
    animation = windows, 1, 3, fastBezier
    animation = windowsOut, 1, 3, fastBezier, popin 80%
    animation = fade, 1, 3, default
    
    # Workspaces are usually what cause the most dizziness. 
    # Try a very short duration (2 or 3) or a "slide" instead of "fade"
    animation = workspaces, 1, 3, default, slide
}

dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    vrr = 1
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

input {
    kb_layout = us , tr
    kb_variant = 
    kb_model =
    kb_rules =
    kb_options = grp:ctrl_space_toggle,caps:escape


    repeat_rate = 50
    repeat_delay = 300

    follow_mouse = 1
    # force_no_accel = 1
    accel_profile = flat
    sensitivity = 0.0 # -5.0 - 5.0, 0 means no modification.
    
    touchpad {
        scroll_factor = 0.2
        natural_scroll = true    
    }
}

device {
    name = logitech-gaming-mouse-g402
    sensitivity = 0.0
    accel_profile = flat
}

device {
    name = syna32e3:00-06cb:cee7-touchpad
    sensitivity = 1.5
    accel_profile = flat
}

###################
### KEYBINDINGS ###
###################


$mainMod = SUPER # Sets "Windows" key as main modifier
$shiftMod = SHIFT

bind = $mainMod, i , exec, kitty "pacseek"

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Backspace, killactive
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, n, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, w, fullscreen

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# bind = $mainMod SHIFT, 1, movetoworkspace, 1
# bind = $mainMod SHIFT, 2, movetoworkspace, 2
# bind = $mainMod SHIFT, 3, movetoworkspace, 3
# bind = $mainMod SHIFT, 4, movetoworkspace, 4
# bind = $mainMod SHIFT, 5, movetoworkspace, 5
# bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split:workspace, 1
bind = $mainMod, 2, split:workspace, 2
bind = $mainMod, 3, split:workspace, 3
bind = $mainMod, 4, split:workspace, 4
bind = $mainMod, 5, split:workspace, 5
bind = $mainMod, 6, split:workspace, 6
bind = $mainMod, 7, split:workspace, 7
bind = $mainMod, 8, split:workspace, 8
bind = $mainMod, 9, split:workspace, 9
bind = $mainMod, 0, split:workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split:movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split:movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split:movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split:movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split:movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split:movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split:movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split:movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split:movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split:movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

#move windows
bind = $mainMod  SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod, X, movewindow, mon:+1

# focuse monitors
bind = SUPER ALT, h, focusmonitor, 0
bind = SUPER ALT, l, focusmonitor, 1

bind = SUPER, comma, swapactiveworkspaces, current +1
bind = SUPER, period, swapactiveworkspaces, current -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -----------------------------------------------------------------
# --- Resize Submap ---
# -----------------------------------------------------------------
# Create a submap
bind = $mainMod, R, submap, resize

# Define the submap (this is a special block)
submap = resize

# Binds within the submap
binde = , l, resizeactive, 50 0
binde = , h, resizeactive, -50 0
binde = , k, resizeactive, 0 -50
binde = , j, resizeactive, 0 50

# Exit the submap
bind = , escape, submap, reset

# End the submap definition
submap = reset
# -----------------------------------------------------------------

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#Toggle waybar
# bind = alt, w, exec, pkill -SIGUSR1 waybar

#lock screen with hyprlock
bind = alt, f4, exec, dms ipc call lock lock

# Window cycling (Next/Previous)
bind = $mainMod, tab, cyclenext

#screenshot with hyprshot
bind = alt, PRINT, exec, hyprshot -m window
bind = ,PRINT, exec, hyprshot -m output
bind = $shiftMod, PRINT, exec, hyprshot -m region

#adjust brightnes
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+

# Toggle fake fullscreen (keeps tiling but maximizes space)
bind = $mainMod SHIFT, f, fullscreen, 1

# Quick access to system monitor (bpytop in terminal)
bind = $mainMod, t, exec, kitty -e bpytop

# Open configuration folder
bind = $mainMod, o, exec, kitty -e nvim ~/.config/hypr/hyprland.conf

# Open and close Waypaper under Waybar
bind = $mainMod, g, exec, pgrep -x waypaper >/dev/null && pkill -x waypaper || waypaper

# Keybind to set a random wallpaper using waypaper
# bind = $mainMod, r, exec, waypaper --random

# Quick window positioning for floating windows
binde = $mainMod CTRL, h, moveactive, -50 0
binde = $mainMod CTRL, l, moveactive, 50 0
binde = $mainMod CTRL, k, moveactive, 0 -50
binde = $mainMod CTRL, j, moveactive, 0 50

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# For better bluethoot gui
# windowrule {
#     # For better bluethoot gui
#     name = floating-blueman
#     match:class = blueman-manager
#
#     float = true
# }
# windowrule {
#     # For better bluethoot gui
#     name = size-and-move
#     match:class = blueman-manager
#
#     size = 600 400
#     move = 100%-w-11 4.6%
# }

windowrule {
    # Float Waypaper with 16:9 aspect ratio and centered 
    name = waypaper-floating
    match:class = ^(waypaper)$

    float = true
    size = 720 720
    center = true
    move = y+40
}

windowrule {
    # Float xdg-desktop-portal-gtk
    name = xdg-desktop-portal-gtk-floating
    match:class = ^(xdg-desktop-portal-gtk)$

    float = true
}

windowrule {
    # gamescope fullscreen
    name = gamescope-fullscreen
    match:class = ^(gamescope)$

    fullscreen = true
}

windowrule {
    # Float Matplotlib windows
    name = matplotlib-floating
    match:class = ^(Matplotlib)$

    float = true
}

windowrule {
    # Float lxqt-policykit-agent windows
    name = lxqt-policykit-agent-floating
    match:class = ^(lxqt-policykit-agent)$

    float = true
}

windowrule {
    name = fullscreen-steam-games
    match:class = ^(steam_app_\d+)$
    fullscreen = true
}

xwayland { force_zero_scaling= true }
